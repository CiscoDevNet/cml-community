          \      <div class=\"ascii-art\">\n    ___________\n   /  ______  /|\n  /\
          \  /     / / |\n /__/     /_/  |    <- This is the internet (simulated)\n\
          \ |  |     | |  |\n |  |_____|_|  /\n |   ___   |  /\n |  |___   | /\n |________|/\n\
          \        </div>\n\n        <p><strong>Available destinations:</strong></p>\n\
          \        <ul>\n            <li>You are here (nowhere in particular)</li>\n\
          \            <li>There might be other places (check your DNS)</li>\n   \
          \         <li>The void (always accessible)</li>\n        </ul>\n\n     \
          \   <hr>\n\n        <p>\n            <em>Helpful hint:</em> If you're looking\
