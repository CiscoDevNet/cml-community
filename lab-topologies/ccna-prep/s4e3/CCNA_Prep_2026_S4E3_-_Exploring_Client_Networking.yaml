          \        |  Network Monitoring        |\n        +----------------------------+\n\
          \        |  Router (HQ): [  ✔  ]      |\n        |  Client Switch: [  ✔\
          \  ]    |\n        |  Server Switch: [  ✔  ]   |\n        |  Web Server:\
          \ [  ✔  ]      |\n        +----------------------------+\n        </pre>\n\
          \    </div>\n    <p>All devices are up and functioning. Network status is\
          \ stable.</p>\n</div>\n\n<div class=\"container\" id=\"help\">\n    <h2>❓\
          \ Need Assistance?</h2>\n    <p>For help with network configurations, please\
