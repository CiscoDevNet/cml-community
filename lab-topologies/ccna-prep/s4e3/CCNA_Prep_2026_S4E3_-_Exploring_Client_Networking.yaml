          \        }\n\n        nav a {\n            color: white;\n            text-decoration:\
          \ none;\n            margin: 0 15px;\n            font-weight: bold;\n \
          \       }\n\n        nav a:hover {\n            text-decoration: underline;\n\
          \        }\n\n        .container {\n            padding: 2em;\n        \
          \    background-color: white;\n            border-radius: 8px;\n       \
          \     box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);\n            margin-top:\
          \ 20px;\n        }\n\n        .ascii-art {\n            text-align: center;\n\
          \            font-size: 18px;\n            color: #1abc9c;\n        }\n\n\
          \        table {\n            width: 100%;\n            border-collapse:\
          \ collapse;\n            margin-top: 1em;\n        }\n\n        table, th,\
          \ td {\n            border: 1px solid #ccc;\n        }\n\n        th, td\
          \ {\n            padding: 0.8em;\n            text-align: left;\n      \
          \  }\n\n        th {\n            background-color: #34495e;\n         \
          \   color: white;\n        }\n\n        .footer {\n            text-align:\
          \ center;\n            background-color: #2c3e50;\n            color: white;\n\
          \            padding: 1em;\n            margin-top: 20px;\n        }\n\n\
          \        .footer a {\n            color: #1abc9c;\n            text-decoration:\
          \ none;\n        }\n    </style>\n</head>\n<body>\n\n<header>\n    <h1>Internal\
          \ Network Configuration</h1>\n    <p>Company's Centralized Network Management\
          \ Dashboard</p>\n</header>\n\n<nav>\n    <a href=\"#overview\">Overview</a>\n\
          \    <a href=\"#config\">Configurations</a>\n    <a href=\"#status\">Network\
          \ Status</a>\n    <a href=\"#help\">Help</a>\n</nav>\n\n<div class=\"container\"\
          \ id=\"overview\">\n    <h2>\U0001F527 Overview of Network Setup</h2>\n\
          \    <div class=\"ascii-art\">\n        <pre>\n _____\n/     \\\n      \
          \ | admin |-----+\n        \\_____/      |\n                           \
          \  |\n             +--------+--------+\n             | client-switch   \
          \ |\n             +--------+--------+\n                      |\n       \
          \      +--------+--------+\n             |   router (HQ)   |\n         \
          \    +--------+--------+\n                      |\n             +--------+--------+\n\
          \             | server-switch   |\n             +--------+--------+\n  \
          \                    |\n             +--------+--------+\n             |\
          \  web-server     |\n             +-----------------+\n        </pre>\n\
          \    </div>\n    <p>This diagram represents the network topology with admin\
          \ and office users, client-switch, router (HQ), server-switch, and a web-server.</p>\n\
          </div>\n\n<div class=\"container\" id=\"config\">\n    <h2>\U0001F527 Network\
          \ Configuration</h2>\n    <table>\n        <tr>\n            <th>Device</th>\n\
          \            <th>IP Address</th>\n            <th>Status</th>\n        </tr>\n\
          \        <tr>\n            <td>Router (HQ)</td>\n            <td>172.18.0.1</td>\n\
          \            <td>Active</td>\n        </tr>\n        <tr>\n            <td>Client\
          \ Switch</td>\n            <td>192.168.10.1</td>\n            <td>Active</td>\n\
          \        </tr>\n        <tr>\n            <td>Server Switch</td>\n     \
          \       <td>10.20.00.1</td>\n            <td>Active</td>\n        </tr>\n\
          \        <tr>\n            <td>Web Server</td>\n            <td>10.20.01.1</td>\n\
          \            <td>Active</td>\n        </tr>\n    </table>\n</div>\n\n<div\
          \ class=\"container\" id=\"status\">\n    <h2>\U0001F310 Current Network\
