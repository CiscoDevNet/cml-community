    </pre>

    ## Exploring Networking on Linux
    Linux powers the majority of servers on the Internet and in data centers. It is also becoming more popular as an end-user system. There are several distributions of Linux that vary in small and large ways, but the basic networking tools for exploring network state are common across most distributions.

    In this section, we'll explore Linux networking with two different distributions included in CML: Ubuntu and Alpine.

    ### The "ip" command
    > Note: A few years ago Hank wrote a [blog post](https://blogs.cisco.com/learning/exploring-the-linux-ip-command) all about the ip command in Linux.

    Linux has been around for many years, and over time, the commands and utilities for network management have evolved. For many years, the command `ifconfig` was the primary tool for viewing network information. While it is still available on many Linux systems, the modern, recommended tool is `ip`. Let's explore it!

    #### Layer 3: `ip address`

    > Note: The username/password for the "ubuntu" and "alpine" hosts are `cisco / cisco`.

    1. Open the console for the "ubuntu" client and log in.
    2. Run the command `ip address`.

        > Note: Your output for MAC addresses, DHCP-provided IPv4 addresses, and autoconfigured IPv6 addresses will vary based on your own lab environment.

        <pre>
        cisco@ubuntu:~$ <span style="font-weight: bold;">ip add</span>

        1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN group default qlen 1000
            link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00
            <span style="background-color:yellow">inet 127.0.0.1/8</span> scope host lo
            valid_lft forever preferred_lft forever
            <span style="background-color:yellow">inet6 ::1/128</span> scope host noprefixroute
            valid_lft forever preferred_lft forever
        2: ens2: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc fq_codel state UP group default qlen 1000
            link/ether 52:54:00:80:f8:23 brd ff:ff:ff:ff:ff:ff
            altname enp0s2
            <span style="background-color:yellow">inet 10.80.5.22/24</span> metric 100 brd 10.80.5.255 scope global dynamic ens2
            valid_lft 86309sec preferred_lft 86309sec
            <span style="background-color:yellow">inet6 2001:db8:acad:5:5054:ff:fe80:f823/64 scope global</span> dynamic mngtmpaddr noprefixroute
            valid_lft 2591987sec preferred_lft 604787sec
            <span style="background-color:yellow">inet6 fe80::5054:ff:fe80:f823/64 scope link</span>
            valid_lft forever preferred_lft forever
        </pre>

        * There is a lot of information in the output. For now, find the IP addresses listed. You should see both IPv4 and IPv6 addresses for two interfaces. Yes, two: most Linux systems have a loopback interface in addition to any other interfaces that are added or configured.

    3. Let's explore some variations of `ip address` to see what is possible.  Try these options:
        * `ip -4 address`: Displays just the IPv4 addresses.
        * `ip -6 address`: Displays just the IPv6 addresses.
        * `ip address show`: `show` is the default option for `ip address`.
        * `ip address show dev ens2`: Shows information for just a single interface.
        * `ip address help`: Displays the help information. Look at the top and find other options, such as `add` and `del`. We'll try them soon!

    4. Let's add an additional address to the interface.

        > Note: Changing network configuration requires root/admin rights, so we need `sudo` to make changes.

        <pre>
        <span style="font-weight: bold;">sudo ip address add 10.80.5.109/24 dev ens2</span></pre>

    5. Inspect the changes. Feel free to try different `show` variations if you'd like.

        <pre>
        cisco@ubuntu:~$ <span style="font-weight: bold;">ip -4 address show dev ens2</span>

        2: ens2: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc fq_codel state UP group default qlen 1000
            altname enp0s2
            inet 10.80.5.22/24 metric 100 brd 10.80.5.255 scope global <span style="background-color:yellow">dynamic</span> ens2
            valid_lft 85387sec preferred_lft 85387sec
            inet 10.80.5.109/24 scope global <span style="background-color:yellow">secondary</span> ens2
            valid_lft forever preferred_lft forever
        </pre>

        * Compare the two addresses and note the differences.
            * "dynamic" indicates addresses configured with DHCP.
            * "secondary" is applied to additional IPs added to a single interface.

    6. Now remove the address.

        <pre>
        <span style="font-weight: bold;">sudo ip address del 10.80.5.109/24 dev ens2</span></pre>

    #### Layer 1 & 2: `ip link`
    The `ip address show` command includes more than just Layer 3 address information. If you run the command again, you'll see that the first few lines of output provide quite a bit of useful information. If you only remember one command, `ip address show` is a good one to remember, but there are other commands that focus on specific output. *Another* command worth trying is `ip link` when you want to focus on the lowest levels of the OSI model.

    1. On the "ubuntu" console, run the `ip link show dev ens2` command.

        <pre>
        cisco@ubuntu:~$ <span style="font-weight: bold;">ip link show dev ens2</span>

        2: ens2: <BROADCAST,MULTICAST,UP,LOWER_UP> <span style="background-color:yellow">mtu 1500</span> qdisc fq_codel <span style="background-color:yellow">state UP</span> mode DEFAULT group default qlen 1000
            <span style="background-color:yellow">link/ether 52:54:00:80:f8:23</span> brd ff:ff:ff:ff:ff:ff
            altname enp0s2
        </pre>

        * The most useful information for a CCNA candidate is highlighted. This command can answer these questions:
            * Is the link operational from the client's perspective (Layer 1)?
            * What is the MAC address of the interface (Layer 2)?
            * What MTU is configured on the client?

        > Note: This output and data are also available with `ip address show`.

    2. If you check out `ip link help`, you'll see that you can `add` or `del` links as well. This can be used to create VLAN interfaces on a Linux host. Fun, but out of scope for the CCNA and this lab. ;-)
    3. An important skill for a CCNA candidate is knowing how to enable or disable an interface. We can do that with `ip link set`. Let's "shut down" the interface.

        <pre>
        cisco@ubuntu:~$ <span style="font-weight: bold;">sudo ip link set dev ens2 down</span>

        cisco@ubuntu:~$ <span style="font-weight: bold;">ip link show dev ens2</span>
        2: ens2: <BROADCAST,MULTICAST> mtu 1500 qdisc fq_codel <span style="background-color:yellow">state DOWN</span> mode DEFAULT group default qlen 1000
            link/ether 52:54:00:80:f8:23 brd ff:ff:ff:ff:ff:ff
            altname enp0s2
        </pre>

    5. Let's bring it back up.

        <pre>
        cisco@ubuntu:~$ <span style="font-weight: bold;">sudo ip link set dev ens2 up</span>

        cisco@ubuntu:~$ <span style="font-weight: bold;">ip link show dev ens2</span>
        2: ens2: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc fq_codel <span style="background-color:yellow">state UP</span> mode DEFAULT group default qlen 1000
            link/ether 52:54:00:80:f8:23 brd ff:ff:ff:ff:ff:ff
            altname enp0s2
        </pre>

    #### Checking out the Neighborhood: `ip neigh`
    The final `ip` command we'll check out is `ip neigh`. Let's see what it shows us!

    1. First, let's generate a little bit of traffic. Run these commands on "ubuntu".

        <pre>
        <span style="font-weight: bold;">ping -c 3 server.example.com</span>
        <span style="font-weight: bold;">ping -c 3 csnake.example.com</span>
        <span style="font-weight: bold;">ping -c 3 10.80.5.1</span>
        <span style="font-weight: bold;">ping -c 3 u.cisco.com</span>
        <span style="font-weight: bold;">ping -c 3 10.80.5.251</span>  # This one will fail
        </pre>

    1. On "ubuntu", run `ip neighbor show`.

        <pre>
        cisco@ubuntu:~$ <span style="font-weight: bold;">ip neighbor show</span>
        10.80.5.103 dev ens2 lladdr 52:54:00:65:a5:a0 STALE
        10.80.5.100 dev ens2 lladdr 52:54:00:65:a5:a0 STALE
        10.80.5.1 dev ens2 lladdr aa:bb:cc:00:85:10 STALE
        10.80.5.251 dev ens2 FAILED
        10.80.5.18 dev ens2 lladdr 52:54:00:65:a5:a0 STALE
        fe80::1 dev ens2 lladdr aa:bb:cc:00:85:10 router STALE
        </pre>

        * This command shows details learned by the client using ARP for IPv4 and Neighbor/Router Discovery for IPv6. It's quite useful when troubleshooting.

    #### Explore on Alpine, another Linux distribution
    The `ip` command is common across Linux distributions. Open the console for "alpine", test the `ip address`, `ip link`, and `ip neighbor` commands, and compare the results!

    ### DNS Resolution on Ubuntu with `resolvectl`
    DNS resolution is an area that does vary between different Linux distributions. In this lab we focus on `resolvectl`, a modern DNS resolver standard on Ubuntu and Debian and an option for most other modern Linux distributions.

    1. Open the "ubuntu" console and run `resolvectl` to look at the DNS client configuration.

        <pre>
        cisco@ubuntu:~$ <span style="font-weight: bold;">resolvectl</span>
        Global
                Protocols: -LLMNR -mDNS -DNSOverTLS DNSSEC=no/unsupported
        resolv.conf mode: stub

        Link 2 (ens2)
            Current Scopes: DNS
                Protocols: +DefaultRoute -LLMNR -mDNS -DNSOverTLS DNSSEC=no/unsupported
        <span style="background-color:yellow">Current DNS Server: 10.80.5.100</span>
            <span style="background-color:yellow">DNS Servers: 10.80.5.100</span>
                <span style="background-color:yellow">DNS Domain: example.com</span>
        </pre>

        * The key information available is the configured DNS servers and the default domain. For clients using DHCP for their addresses, this is likely where these settings come from.

    1. You can also just view specific details with `resolvectl dns` and `resolvectl domain`.  Try those commands out!

    1. DNS is critical to a well-functioning client. `resolvectl` makes it easy to test and inspect how resolution is working on a client.

        <pre>
        cisco@ubuntu:~$ <span style="font-weight: bold;">resolvectl query server.example.com</span>

        <span style="background-color:yellow">server.example.com: 10.80.5.100</span>                -- link: ens2

        -- Information acquired via protocol DNS in 2.4ms.
        -- Data is authenticated: no; Data was acquired via local or encrypted transport: no
        -- <span style="background-color:yellow">Data from: cache network</span>
        </pre>

        * Here, we can see the result of the query, as well as that the client's "cache" was used to answer it.

    1. A "cache" is short-term storage that a client uses to "remember" the answers to DNS lookups for efficiency. Sometimes, however, cached data can be wrong. Cache entries will eventually age out on their own, but you can also manually "flush" the cache.

    1. Flush the cache on "ubuntu" with `sudo resolvectl flush-caches`.

        <pre>
        cisco@ubuntu:~$ <span style="font-weight: bold;">sudo resolvectl flush-caches</span>
        </pre>

    1. Try the query again.

        <pre>
        cisco@ubuntu:~$ <span style="font-weight: bold;">resolvectl query server.example.com</span>

        server.example.com: 10.80.5.100                -- link: ens2

        -- Information acquired via protocol DNS in 2.5ms.
        -- Data is authenticated: no; Data was acquired via local or encrypted transport: no
        <span style="background-color:yellow">-- Data from: network</span>
        </pre>

        * This time, the data was retrieved from the "network", which means a fresh lookup to the DNS server was completed.

    ### Checking DNS client configuration on Alpine at `/etc/resolv.conf`
    Alpine is a minimal Linux distribution typically used for container workloads or single-purpose systems. It does NOT use `resolvectl`; instead, it relies on a lightweight DNS client with limited features. The details of the client aren't important, but Alpine makes a great alternative to Ubuntu for exploring Linux DNS settings.

    1. Open the console for "alpine" and use `nslookup` to make a DNS query.

        <pre>
        alpine:~$ <span style="font-weight: bold;">nslookup csnake</span>

        <span style="background-color:yellow">Server:         10.80.5.100</span>
        Address:        10.80.5.100:53

        <span style="background-color:yellow">csnake.example.com</span>      canonical name = app03.example.com
        Name:   app03.example.com
        Address: 10.80.5.103

        csnake.example.com      canonical name = app03.example.com
        </pre>

        * You'll see the answer to the query, but the key detail we want to see is the DNS server's address. Where is this address set? Why was "example.com" added to "csnake" for the lookup?

    1. Look at the contents of the file `/etc/resolv.conf`

        <pre>
        alpine:~$ <span style="font-weight: bold;">cat /etc/resolv.conf</span>

        <span style="background-color:yellow">search example.com
        nameserver 10.80.5.100</span>
        </pre>

        * The file `/etc/resolv.conf` has been the configuration file for DNS clients on Linux for as long as there have been leaves on trees.
        * Even systems like Ubuntu or macOS (yeah, macOS is related to Linux), which don't use the file directly, typically maintain it with comments pointing to the files or utilities to consult for DNS client information.
            * For extra credit, go check out the contents of this file on the "ubuntu" system.

    1. DNS clients on many Linux systems read `/etc/resolv.conf` to find the DNS servers and default search domains to use. The DHCP client applies the settings to the file, or they are configured statically if DHCP isn't in use.

    ## Exploring Networking on Windows
    > Note: The steps in this part of the lab can be completed using your own Windows PC or laptop, or within CML if you have added a Windows node to your CML instance (see the "Lab Requirements" section above).

    > Note: Windows is typically configured and managed via the graphical interface. This lab guide doesn't support images, so the GUI steps do their best to describe where to click and what to do.

    ### Optional: Adding a Windows Node to the CML Topology
    If you have a Windows node in your CML server, add it to the topology so you can complete the Windows exploration on it.

    1. Add a Windows node to the topology next to the Alpine and Ubuntu nodes.
    1. Add a link from the Windows node to "sw1".
    1. Power on the Windows node and let it boot. DHCP running on "rtr1" will configure the network on the new node.

    ### Finding and Exploring Network Settings in Windows Using the Control Panel or Settings
    > Depending on the version of Windows you are using for this lab, the specific steps and control panel names may vary.

    > Note: The steps below were created using a Windows 10 evaluation edition

    Windows provides several different views and paths for managing network interface properties. With updates to Windows, the look, names, and features of these settings panels can change. Network engineers will benefit from going directly to the "Network Connections" interface. The steps below describe how to navigate to this screen through the GUI.

    ***However,*** you can shortcut this process by remembering the path `ncpa.cpl`. This is the direct name of the "Network Connections" control panel. It has been a path in Windows for a very long time, and hopefully always will be. Enter it in a "Run" dialog to open the page directly.

    **GUI Navigation Steps to "Network Connections":**

    1. From the Windows desktop, open the "Control Panel" or "Settings" interface.
    1. Find the "Network and Internet" option.
        * The main settings panel will likely provide details about the connection status. This will vary depending on whether you're on a wired or wireless connection, a home or work network, and other factors.
    1. Look for an option to "View your network properties". This typically provides read-only information about the interface, such as its IP address, DHCP status, and DNS configuration.
    1. Look for an option for "Network and Sharing Center". This will open a new window.
    1. Find the option for "Change adapter settings". This should open a "Network Connections" window that lists each network interface in an Explorer-like window.

    **Investigating the Network Settings:**

    1. Double-click the network interface to open the status page.
    1. Click the "Details..." button to open the "Network Connection Details" interface. On this page, you'll find:
        * DNS suffix/default search domain
        * Physical Address (MAC Address)
        * Whether DHCP is enabled, including the DHCP server
        * IP addresses, masks, and gateways
    1. Right-click the interface and select "Properties".
    1. From the interface properties dialog, you can open "Properties" for "Internet Protocol Version 4" or "Internet Protocol Version 6". These dialogs allow you to configure address information on an interface.

    ### Windows CLI Commands for Network Operations
    Windows provides "Command Prompt" and PowerShell CLI interfaces that can also be used to investigate network settings. Here are commands to try in each interface:

    | Task | Command Prompt (`cmd`) | PowerShell |
    | --- | --- | --- |
    | View interface addresses, subnet masks, gateways, and DHCP status | `ipconfig /all` | `Get-NetIPConfiguration -Detailed`<br>`Get-NetIPInterface` (check the `Dhcp` property) |
    | View IPv4 ARP and IPv6 neighbor entries | `arp -a`<br>`netsh interface ipv6 show neighbors` | `Get-NetNeighbor` |
    | View DNS client configuration | `ipconfig /all` | `Get-DnsClientServerAddress`<br>`Get-DnsClientGlobalSetting` |
    | Flush the DNS resolver cache | `ipconfig /flushdns` | `Clear-DnsClientCache` |

    ## Exploring Networking on macOS
    > Note: The steps in this part of the lab can be completed using your own macOS PC or laptop. There is no CML option for macOS.

    > Note: macOS clients are typically configured and managed via the graphical interface. This lab guide doesn't support images, so the GUI steps do their best to describe where to click and what to do.

    ### Finding and Exploring Network Settings in macOS Using System Settings
    > Depending on the version of macOS you are using for this lab, the specific steps and control panel names may vary.

    > Note: The steps below were created using a macOS 27 Golden Gate laptop connected to a wireless network.

    1. Open "System Settings"
    1. Find the "Network" panel
    1. You should see a list of network adapters and security services such as "Filters" or "Firewall" listed.
    1. Click on the active network interface.  If you are on wireless, it will be called "Wi-Fi".
    1. Open the "Details" for the interface.
    1. You should see options for "TCP/IP" and "DNS" in the left pane.
    1. Click on "TCP/IP".  Look for:
        * Whether IPv4 is configured "Using DHCP" or "Manually"
        * The current IP address information
    1. Click on "DNS". Look for:
        * The configured DNS servers
        * Whether any search domains are configured

    ### macOS CLI Commands for Network Operations
    macOS includes several command-line tools for inspecting network settings and testing connectivity. Open Terminal and try these commands:

    | Task | Command |
    | --- | --- |
    | View interface addresses and status | `ifconfig` |
    | List network ports and their device names | `networksetup -listallhardwareports` |
    | View settings for a network service (replace `Wi-Fi` with the service name) | `networksetup -getinfo Wi-Fi` |
    | View the default route and gateway | `route -n get default` |
    | View IPv4 ARP and IPv6 neighbor entries | `arp -a`<br>`ndp -a` |
    | View DNS resolver configuration | `scutil --dns` |
    | Flush DNS cache | `sudo dscacheutil -flushcache` <br> `sudo killall -HUP mDNSResponder` |

    ## Some brief details on wireless
    Many end-user clients connect to the network via wireless connections. Going deep into wireless is out of scope for this lab, but we wanted to provide a few tips about what to consider and how to interpret details from your client.

    The operating system, adapter type, and drivers in use play a significant part in determining what details are available about your wireless connection. Once you find this information, here are key details a CCNA candidate should look for and how to understand them.

    * **SSID**: This is the "name" of the network you have joined.
    * **Security**: This is the type of security in use. A "home" network might use "WPA2 Personal", while an enterprise network might use "WPA2 Enterprise". "WPA3" is a newer, more secure standard, but it is not widely deployed yet. "Open" indicates that the network has no built-in security. This might be the case at a public location, where you should consider the network completely unsafe; be careful.
    * **Channel / Radio**: This indicates whether you are connected to a 2.4 GHz or 5 GHz access point, as well as the specific channel. 2.4 GHz channels might be 1, 6, or 11. 5 GHz uses higher channel numbers, such as 36, 100, and 149. Channels vary by country.
    * **RSSI**: This indicates the strength of the wireless signal. It is measured in dBm (decibel-milliwatts) and is a negative number. Many factors determine whether a signal is "good" or "bad", but a rule of thumb is that an RSSI greater than -65 dBm is acceptable. So -40 dBm would be "great", while -75 dBm would be "bad".
    * **Noise**: Also measured in dBm and expressed as a negative value, this is a measure of the background noise in the wireless network. Lower is better. Generally, you'd want a noise value less than -80 dBm.
    * **Signal-to-noise ratio**: This measures the difference between the RSSI and the noise level and has a significant impact on signal quality. The bigger the difference, the better the connection. A difference of 20 dB or higher is generally considered a good target.
        * For example, an RSSI of -67 dBm and a noise level of -92 dBm (a 25 dB difference) is fine. But if the noise were -80 dBm (a 13 dB difference), clients would likely start having connection issues.
