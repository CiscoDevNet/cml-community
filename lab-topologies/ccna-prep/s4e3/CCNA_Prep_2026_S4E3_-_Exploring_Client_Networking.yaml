nodes:
  - boot_disk_size: null
    configuration:
      - name: node.cfg
        content: "# this is a shell script which will be sourced at boot\nhostname\
          \ server\n# configurable user account\nUSERNAME=cisco\nPASSWORD=cisco\n\n\
          # Create command aliases\necho 'alias ping=\"ping -c 4\"' >> /etc/profile.d/aliases.sh\n\
          \n# Configure static IP address\nip addr add 10.80.5.100/24 dev eth0 # server\n\
          ip addr add 10.80.5.101/24 dev eth1 # app01\nip addr add 10.80.5.102/24\
          \ dev eth2 # app02\nip addr add 10.80.5.103/24 dev eth3 # app03\nip link\
          \ set dev eth1 up\nip link set dev eth2 up\nip link set dev eth3 up\nip\
          \ route add default via 10.80.5.1\necho \"nameserver 8.8.8.8\" > /etc/resolv.conf\n\
          \n# Install and Configure Bind DNS Server\napk add bind\n# Create /etc/bind/named.conf\n\
          # Note: Cisco Umbrella DNS used for forwarders\necho '\noptions {\n  directory\
          \ \"/var/bind\";\n  allow-recursion { 10.0.0.0/8; };\n  forwarders {\n \
          \ 208.67.222.222;\n  208.67.220.220;\n  };\n  listen-on { 10.80.5.100; };\n\
          \  listen-on-v6 { none; };\n  pid-file \"/var/run/named/named.pid\";\n \
          \ allow-transfer { none; };\n};\nzone \"example.com\" IN {\ntype master;\n\
          file \"/etc/bind/db.example.com\";\n};\nzone \"5.80.10.in-addr.arpa\" {\n\
          \    type master;\n    file \"/etc/bind/db.10.80.5\";\n};\nzone \"10.80.10.in-addr.arpa\"\
          \ {\n    type master;\n    file \"/etc/bind/db.10.80.10\";\n};\n' > /etc/bind/named.conf\n\
          \n# Create zone file for example.com\necho '\n$TTL 86400\n@       IN   \
          \   SOA     server.example.com.      hostmaster.example.com. (\n      2025020201\t\
          ; serial number YYMMDDNN\n      28800           ; Refresh\n      7200  \
          \          ; Retry\n      864000          ; Expire\n      86400        \
          \   ; Min TTL\n      )\n\n    NS      server.example.com.\n\n; Websites\n\
          system.support  IN      CNAME   app01.example.com.\nquantumcloud      IN\
          \      CNAME   app02.example.com.\ncsnake          IN      CNAME   app03.example.com.\n\
          aaisolutions      IN      CNAME   app03.example.com.\n\n\n; End Devices\n\
          server          IN      A       10.80.5.100\napp01           IN      A \
          \      10.80.5.101\napp02           IN      A       10.80.5.102\napp03 \
          \          IN      A       10.80.5.103\n\n\n$ORIGIN example.com.\n' > /etc/bind/db.example.com\n\
          \n# Create zone file for 10.80.5\necho '\n$TTL 86400  ; Default TTL\n@ \
          \  IN  SOA      server.example.com. hostmaster.example.com. (\n  2023010101\
          \ ; Serial\n  86400      ; Refresh\n  7200       ; Retry\n  3600000    ;\
          \ Expire\n  86400 )    ; Minimum TTL\n\n; Name servers\n@   IN  NS     \
          \ server.example.com.\n\n; PTR Records\n101  IN  PTR     server.example.com.\
          \  ; For 10.80.5.11\n111  IN  PTR     app01.example.com.  ; For 10.80.5.111\n\
          121  IN  PTR     mail01.example.com.  ; For 10.80.5.121\n' > /etc/bind/db.10.80.5\n\
          \n# Start bind service\nrc-service named start\n# Re-configured local DNS\
          \ server to use localhost\necho \"nameserver 10.80.5.100\" > /etc/resolv.conf\n\
          \n# Setup nginx as web/app server\napk update\napk add nginx\nrc-service\
          \ nginx stop\n\n# Create the customized nginx.conf to serve multiple pages\n\
          cat > /etc/nginx/nginx.conf << 'EOF'\n\nuser  nginx;\nworker_processes \
          \ auto;\n\nerror_log  /var/log/nginx/error.log notice;\npid        /run/nginx.pid;\n\
          \n\nevents {\n    worker_connections  1024;\n}\n\n\nhttp {\n    include\
          \       /etc/nginx/mime.types;\n    default_type  application/octet-stream;\n\
          \n    log_format  main  '$remote_addr - $remote_user [$time_local] \"$request\"\
          \ '\n                      '$status $body_bytes_sent \"$http_referer\" '\n\
          \                      '\"$http_user_agent\" \"$http_x_forwarded_for\"';\n\
          \n    access_log  /var/log/nginx/access.log  main;\n\n    sendfile     \
          \   on;\n    #tcp_nopush     on;\n\n    keepalive_timeout  65;\n\n    #gzip\
          \  on;\n\n    # Default server - catches unmatched requests\n    server\
          \ {\n        listen 10.80.5.100:80 default_server;\n        server_name\
          \ _;\n\n        location / {\n            root /usr/share/nginx/html;\n\
          \            index index.html;\n        }\n    }\n\n    # app01 - system.support\
          \ - System Support app\n    server {\n        listen 10.80.5.101:80;\n \
          \       server_name system.support.example.com;\n\n        location / {\n\
          \            root /usr/share/nginx/html;\n            try_files /system.support.html\
          \ =404;\n        }\n    }\n\n    # app02 - quantumcloud - Quantum Cloud\
          \ Streaming\n    server {\n        listen 10.80.5.102:80;\n        server_name\
          \ quantumcloud quantumcloud.example.com;\n\n        location / {\n     \
          \       root /usr/share/nginx/html;\n            try_files /quantumcloud.html\
          \ =404;\n        }\n    }\n\n    # app03 - csnake - CYBER SNAKE 2000\n \
          \   server {\n        listen 10.80.5.103:80;\n        server_name csnake\
          \ csnake.example.com;\n\n        location / {\n            root /usr/share/nginx/html;\n\
          \            try_files /csnake.html =404;\n        }\n    }\n\n}\nEOF\n\n\
          mkdir -p /usr/share/nginx/html\n# Create a basic web page for the server\n\
          cat > /usr/share/nginx/html/system.support.html << 'EOF'\n<!DOCTYPE html>\n\
          <html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"\
          viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Network\
          \ Configuration Dashboard</title>\n    <style>\n        body {\n       \
          \     font-family: 'Courier New', monospace;\n            background-color:\
          \ #f4f4f4;\n            color: #333;\n            margin: 0;\n         \
          \   padding: 0;\n        }\n\n        header {\n            background-color:\
          \ #2c3e50;\n            color: white;\n            padding: 1em;\n     \
