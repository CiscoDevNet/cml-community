lab:
  description: Troubleshooting the network doesn’t start at the default gateway—it
    starts directly on the client. The CCNA v2.0 blueprint explicitly requires engineers
    to gather, interpret, and troubleshoot network parameters across Windows, macOS,
    and Linux endpoints. In this live event, Hank and Patrick demonstrate how to navigate
    the command-line and GUI diagnostic utilities of all three major operating systems.
    We'll examine static versus DHCP IPv4/IPv6 assignments, default gateway reachability,
    DNS resolver behavior, and wireless client metrics including SSID association,
    WPA2/WPA3 security negotiations, and signal-to-noise ratio (SNR). Join us to master
    the endpoint view of network connectivity!
  notes: |-
    **CCNA Exam Prep: Back to Networking Basics with Hank Preston and Patrick Gargano**

    # Exploring Client Networking on Windows, Mac, and Linux

    Troubleshooting the network doesn’t start at the default gateway—it starts directly on the client. The CCNA v2.0 blueprint explicitly requires engineers to gather, interpret, and troubleshoot network parameters across Windows, macOS, and Linux endpoints. In this live event, Hank and Patrick demonstrate how to navigate the command-line and GUI diagnostic utilities of all three major operating systems. We'll examine static versus DHCP IPv4/IPv6 assignments, default gateway reachability, DNS resolver behavior, and wireless client metrics including SSID association, WPA2/WPA3 security negotiations, and signal-to-noise ratio (SNR). Join us to master the endpoint view of network connectivity!

    > Blueprint Topics:
    >
    > * 1.6: Troubleshoot wired and wireless client connectivity (IP configuration, network reachability, and wireless security parameters on Windows, macOS, and Linux)
    > * 1.3 / 1.4: Troubleshoot IPv4 and IPv6 address configuration and subnetting
    > * 1.5: Describe wireless principles (SSID, bands, RF characteristics, security protocols WPA2/WPA3)


    ## Lab Requirements
    This CML topology and lab require a CML server that supports public Internet access through the external connector named "Internet". It is configured in NAT mode to provide reachability to Internet resources through the CML host. This access is required to configure the "server" node and complete some of the lab exercises.

    If your CML server is "air-gapped" and doesn't have Internet access for topologies, this lab will not work as designed.

    ### Linux Client Testing
    CML ships with a variety of open-source Linux nodes that can be included in topologies to provide clients and hosts. The lab primarily focuses on exploring client connectivity using some of these Linux hosts (Ubuntu and Alpine).

    ### Windows Client Testing
    CML does NOT ship with a Microsoft Windows node; however, YAML definition files for Windows are available in the [CML Community on GitHub](https://github.com/CiscoDevNet/cml-community/tree/master/node-definitions/microsoft). Microsoft makes evaluation versions of Windows available, and these versions can be used with CML with the node definitions.

    The full details of preparing and importing Windows into CML are out of scope for this lab. However, details can be found in CML documentation and community blog posts and videos.

    If you have added a Windows node to your CML instance, the lab guide includes steps to add the node to the topology, link it to the switch, and start it up.

    As an alternative, if you have a personal Windows computer you can run through the Windows client lab steps on your personal computer.

    ### Mac Client Testing
    There are no macOS virtual images that can be run on CML. If you have access to an Apple computer, you can run the steps there. The lab details provided in this guide are general and are offered more as a reference than as a specific lab guide.

    ## Setup and Scenario
    This is a small, simplified network topology that has a "server" and a couple of clients.

    The "server" is a DNS and web server that provides name resolution and hosts several web pages that will be used during our testing.

    We will focus primarily on the "clients" as we explore their network configurations, along with commands and methods for testing and managing those configurations.

    ## Pre-validation
    After starting the lab topology, verify the starting state by running these commands on "server".

    > These commands verify that the startup configuration for "server" was completed successfully. This includes installing the DNS and HTTP services used in this lab.

    <pre>
    server:~$ <span style="font-weight: bold;">dig server.example.com</span>

    ; <<>> DiG 9.20.29 <<>> server.example.com
    ;; global options: +cmd
    ;; Got answer:
    ;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: 23149
    ;; flags: qr aa rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 0, ADDITIONAL: 1

    ;; OPT PSEUDOSECTION:
    ; EDNS: version: 0, flags:; udp: 1232
    ; COOKIE: 452d18fa4c4598ab010000006acfeb1709166434033ffc57 (good)
    ;; QUESTION SECTION:
    ;server.example.com.            IN      A

    ;; ANSWER SECTION:
    <span style="background-color:yellow">server.example.com.     86400   IN      A       10.80.5.100</span>

    ;; Query time: 0 msec
    ;; SERVER: 10.80.5.100#53(10.80.5.100) (UDP)
    ;; WHEN: Fri Oct 30 12:20:05 UTC 2026
    ;; MSG SIZE  rcvd: 91
    </pre>

    <pre>
    server:~$ <span style="font-weight: bold;">curl -I http://server.example.com</span>

    <span style="background-color:yellow">HTTP/1.1 200 OK</span>
    Server: nginx/1.28.3
    Date: Fri, 30 Oct 2026 12:21:19 GMT
    Content-Type: text/html
    Content-Length: 3452
    Last-Modified: Thu, 29 Oct 2026 21:05:32 GMT
    Connection: keep-alive
