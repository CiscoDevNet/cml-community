          \ << 'EOF'\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
          UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
          >\n    <title>Quantum Cloud Streaming</title>\n    <style>\n        * {\n\
          \            margin: 0;\n            padding: 0;\n            box-sizing:\
