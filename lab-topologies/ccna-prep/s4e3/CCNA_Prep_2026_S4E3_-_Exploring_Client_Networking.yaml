          \ | <a href=\"#\">Privacy Policy</a></p>\n</div>\n\n</body>\n</html>\nEOF\n\
          \n# Create a basic web page for the server\ncat > /usr/share/nginx/html/index.html\
          \ << 'EOF'\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"\
