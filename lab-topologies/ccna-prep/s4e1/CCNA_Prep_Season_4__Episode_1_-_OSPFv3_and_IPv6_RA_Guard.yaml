  - border_color: '#00000000'
    border_style: ''
    color: '#000000'
    rotation: 0
    text_bold: false
    text_content: |-
      The CCNA v2.0 blueprint puts a fresh spotlight on IPv6 dynamic routing and modern
      first-hop security. In this lab we break down everything you need to know about OSPFv3.
      We’ll explore how OSPFv3 builds upon familiar OSPFv2 concepts while tackling key
      IPv6 differences, including link-local next hops, 32-bit router ID configuration,
      and per-interface network configuration across broadcast and point-to-point links.
      Along the way, we’ll dive into first-hop defense with IPv6 RA Guard to protect
      clients from rogue router advertisements.
    text_font: monospace
    text_italic: false
    text_size: 12
    text_unit: pt
    thickness: 1
    type: text
    x1: -1123.6568316319003
    y1: -337.8878571798911
    z_index: 5
  - border_color: '#00000000'
    border_style: ''
    color: '#808080FF'
    rotation: 0
    text_bold: false
    text_content: |-
      In this lab we will:
      * Configure and verify single-area OSPFv3
      * Tune OSPFv3 (OSPF cost, DR/BDR election, passive interface)
      * Observe legitimate IPv6 SLAAC and Router Advertisements (RA)
      * Observe a rogue IPv6 RA injected into an access VLAN
      * Configure and verify IPv6 RA Guard to block the rogue RA.
    text_font: monospace
    text_italic: false
