        * The switch interfaces use a standard MTU of 1500 bytes.

    **Diagnosis:** An MTU mismatch between the hosts and the network is causing issues with "bulky" data transmissions. The "test file" is only 9 bytes and doesn't exceed the standard MTU on the switches. However, the config and data files are larger, and the hosts are sending network traffic that is too large for the switches. To resolve the issue, the hosts' MTUs must be no larger than the MTU supported by the switches in the path.

    We can test the diagnosis with ping by setting the size and do-not-fragment bits.

    1. From "client", send a `1472-byte` ping to test the standard MTU by sending a 1500-byte packet.

        <pre>
        client:~$ <span style="font-weight: bold;">ping -c 4 -s 1472 server</span>
