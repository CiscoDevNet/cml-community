    rotation: 0
    text_bold: false
    text_content: |-
      CCNA TROUBLESHOOTING METHODOLOGIES
      ==================================

      1. BOTTOM-UP
         Start at Layer 1 and work upward through Layers 2 and 3 toward the
         application. Check cabling, link status, VLANs, addressing, and routing.
         Useful when a link is down, hardware was recently installed, or the
         connection failed after a move or cabling change.

      2. TOP-DOWN
         Start with the application and work downward toward the physical link.
         Check the reported error, name resolution, transport connectivity, and
         then the underlying network. Useful when basic connectivity works but a
         particular application, service, or hostname does not.

      3. DIVIDE AND CONQUER (MIDDLE-OUT)
         Start at Layer 3 with a ping or traceroute to the gateway or destination.
         If the test succeeds, investigate higher-layer services such as ports,
         DNS, and the application. If it fails, check lower layers such as the
         gateway, ARP, subnet mask, VLAN, and physical connection. A blocked ICMP
         test can look like a connectivity failure, so confirm with other evidence.

      4. HOP-BY-HOP
         Follow the traffic path from the source to the destination, checking each
         network device and link along the way. Verify forwarding, VLANs, trunks,
         and routing at each point. Useful when traffic reaches part of the path
         but fails farther along, or when traceroute identifies a likely drop point.
