lab:
  description: 'When network connectivity breaks, where do you begin? Troubleshooting
    is a cornerstone of the CCNA v2.0 exam, and having a systematic diagnostic methodology
    is what separates guessing from true engineering. In this live stream, Hank and
    Patrick build a practical diagnostic playbook from the ground up. We''ll explore
    structured troubleshooting models using the OSI stack, highlighting core diagnostic
    tools including show commands, syslog inspection, standard/extended ping, and
    traceroute. We’ll also analyze pre-staged packet capture output to interpret real-world
    protocol behaviors (ARP, DHCP, and 802.1Q tags) without getting bogged down in
    capture setup. Finally, we''ll configure and verify Layer 2 storm control to protect
    access switches from broadcast storms. Join us to sharpen your troubleshooting
    instincts! '
  notes: |-
    **CCNA Exam Prep: Back to Networking Basics with Hank Preston and Patrick Gargano**

    # A CCNA Diagnostic Playbook: Isolating Faults from Layer 1 to Layer 7

    When network connectivity breaks, where do you begin? Troubleshooting is a cornerstone of the CCNA v2.0 exam, and having a systematic diagnostic methodology is what separates guessing from true engineering. In this live stream, Hank and Patrick build a practical diagnostic playbook from the ground up. We'll explore structured troubleshooting models using the OSI stack, highlighting core diagnostic tools, including show commands, syslog inspection, standard and extended ping, and traceroute. We’ll also analyze pre-staged packet capture output to interpret real-world protocol behaviors (ARP, DHCP, and 802.1Q tags) without getting bogged down in capture setup. Join us to sharpen your troubleshooting instincts!

    > Blueprint Topics:
    >
    > * 1.1: Diagnose interface and cable issues (collisions, errors, duplex, speed)
    > * 1.6 Troubleshoot wired and wireless client connectivity (IP configuration, network reachability, and wireless security parameters on Windows, macOS, and Linux)
    > * 2.4: Troubleshoot basic Layer 2/Layer 3 connectivity and device operations using show commands (including show logs), ping, extended ping, traceroute, and packet capture output

    > Note: A PDF version of this lab guide is available on the [CML Community](https://github.com/CiscoDevNet/cml-community/blob/master/lab-topologies/ccna-prep/s4e2/).


    ## Lab Requirements
    This CML topology and lab require a CML server that supports public Internet access through the external connector named "Internet". It is configured in NAT mode to provide reachability to Internet resources through the CML host. This access is required to configure the "server" node and to complete some of the lab exercises.

    If your CML server is "air-gapped" and doesn't have Internet access for topologies, this lab will not work as designed.

    ## Setup and Scenario
    This is a simplified network topology connecting a "client" and a "server" that is used as the basis for a series of "trouble tickets": scenarios where some network-based traffic is not working as expected.

    The "server" is an Alpine Linux host, reachable at IP address 10.80.15.3. It acts as a DNS server for the domain "example.com" and provides recursive lookups to public DNS servers. It also represents a "web application server" hosting files that the "client" should be able to access.

    The "client" is an Alpine Linux host and uses DHCP from "sw2" to configure its IP address. See `/etc/network/interfaces`.

    ## Pre-validation
    After starting the lab topology, verify the starting state by running these commands on "server".

    > These commands verify that the startup configuration for "server" was completed successfully. This includes installing the DNS and HTTP services used in this lab.

    <pre>
    server:~$ <span style="font-weight: bold;">dig server.example.com</span>

    ; <<>> DiG 9.20.29 <<>> server.example.com
    ;; global options: +cmd
    ;; Got answer:
    ;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: 23149
    ;; flags: qr aa rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 0, ADDITIONAL: 1

    ;; OPT PSEUDOSECTION:
    ; EDNS: version: 0, flags:; udp: 1232
    ; COOKIE: 452d18fa4c4598ab010000006acfeb1709166434033ffc57 (good)
    ;; QUESTION SECTION:
    ;server.example.com.            IN      A

    ;; ANSWER SECTION:
    <span style="background-color:yellow">server.example.com.     86400   IN      A       10.80.15.3</span>

    ;; Query time: 1 msec
    ;; SERVER: 10.80.15.3#53(10.80.15.3) (UDP)
    ;; WHEN: Wed Oct 14 20:50:31 UTC 2026
    ;; MSG SIZE  rcvd: 91
    </pre>

    <pre>
    server:~$ <span style="font-weight: bold;">wget -O - http://server/test.txt</span>
    Connecting to server (127.0.0.1:80)
    writing to stdout
    <span style="background-color:yellow">Success!</span>
    -                    100% |********************************|     9  0:00:00 ETA
    written to stdout
    </pre>

    # Trouble Tickets
    The following troubleshooting tickets can be completed using the CML topology after it starts. Each ticket is self-contained; however, they should be completed in order because later tickets may "assume" that previous tickets have already been solved.

    Troubleshooting walkthroughs for each ticket are provided, but initially collapsed/hidden so you can try to solve the ticket on your own.

    ## Trouble Ticket #1: Client / Server Not Making a Connection
    **Title:** A newly deployed "client" can't ping its "server"

    **Description:** The team just deployed a new "client" host at a new site. The "client" is connected to "sw2" on port `e1/0`. It needs to be able to ping "server" (`10.80.15.3/29`) which is connected to "sw1". Both hosts are on the "APPLICATION" network.

    **Troubleshooting Method Suggestion:** Bottom Up / Hop-by-Hop

    **Ticket Goal:** Identify and fix the issue preventing "client" from pinging "server"

    <details>
    <summary>Troubleshooting Walkthrough</summary>
    We will tackle this ticket starting at the new "client" host, using a combination of hop-by-hop and bottom-up methodologies.

    1. From the "client" and "sw2" consoles, check the network connection state (layer 1).

        <pre>
        client:~$ <span style="font-weight: bold;">ip link</span>

        1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN qlen 1000
            link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00
        2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast state <span style="background-color:yellow">UP</span> qlen 1000
            link/ether 52:54:00:a4:78:3d brd ff:ff:ff:ff:ff:ff
        </pre>

        <pre>
        sw2# <span style="font-weight: bold;">show int e1/0 status</span>

