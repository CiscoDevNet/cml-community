        </pre>

        * Note: The ICMPv4 header is 8 bytes, and the IPv4 header is 20 bytes.

            <pre>
            1472 (data) + 8 (ICMP) + 20 (IPv4) = 1500 bytes
            </pre>

    1. Now, from "client", send a "jumbo" ping with a total size larger than 1500 bytes.

        <pre>
        client:~$ <span style="font-weight: bold;">ping -c 4 -s 2000 server</span>
        PING server (10.80.15.3): 2000 data bytes

        --- server ping statistics ---
        <span style="background-color:red;color:white">4 packets transmitted, 0 packets received, 100% packet loss</span>
        </pre>

    Diagnosis verified!

    </details>

    <details>
    <summary>Fixing the Issue!</summary>
    This ticket was about diagnosing the problem, but you may want to fix it too! Me too :-)

    The problem is that the hosts are using a larger MTU than the network supports. We either need to increase the network's MTU or decrease the MTU on the hosts.

    > Note: Having a network with a larger MTU than its hosts is typically not a problem. This configuration is common in a data center, where the switches would be configured for jumbo frames and server engineers could choose to use jumbo frames on a server-by-server basis.

    The IOL switches used in this lab don't support changing the MTU on the network, but we can change the MTU on the Linux hosts using the `ip link` command.

    Run this command on "client".  No reboot is necessary.

    <pre>
    <span style="font-weight: bold;">sudo ip link set dev eth0 mtu 1500</span>
    </pre>

    Now try to download the config or data file.

    <pre>
    client:~$ <span style="font-weight: bold;">wget http://server/config.file</span>
    Connecting to server (10.80.15.3:80)
    saving to 'config.file'
    config.file          100% |********************************| 1024k  0:00:00 ETA
    'config.file' saved
    </pre>

    Success!

    You may wonder why we didn't need to change the MTU on the server. That's a great question. During the four-way handshake for TCP, hosts negotiate a maximum segment size. If two hosts support different MTUs, they will agree to use the largest MTU supported by both.

    </details>


