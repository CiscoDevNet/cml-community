          !
          !
          access-list 10 permit 10.1.0.0 0.0.255.255
          ip nat inside source list 10 interface e0/0 overload
          !
          !
          line con 0
           exec-timeout 0 0
           logging synchronous
          line aux 0
          line vty 0 4
           exec-timeout 0 0
           password cisco
           transport input all
          !
          !
          !
          !
